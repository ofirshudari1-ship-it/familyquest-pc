<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>FamilyQuest PC</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .card {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: radial-gradient(circle at 30% 20%, #4834a3, #2b2d63 70%);
    border-radius: 18px;
    color: #fff;
    -webkit-app-region: drag;
  }
  img {
    width: 112px;
    height: 112px;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.2px;
  }
  .spinner {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.25);
    border-top-color: #ffd166;
    animation: spin 0.8s linear infinite;
  }
  .version {
    position: absolute;
    bottom: 12px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner {
      animation: none;
      opacity: 0.6;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <img id="logo" alt="" />
    <h1>FamilyQuest PC</h1>
    <div class="spinner"></div>
    <span class="version" id="version"></span>
  </div>
  <script>
    // logo src + versionText are injected by windows.cjs via executeJavaScript
    // after load (same real coin-and-star app icon used for the tray/window
    // icon in electron/icon.cjs, kept as one source of truth for the brand mark).
  </script>
</body>
</html>
